<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarConnect24 — Car details</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css?v=2a0fb80e">
<style>
  .detail{max-width:1100px;margin:0 auto;padding:22px 20px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
  .db{background:#20272a;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:4/3}
  .db img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .3s}
  .db img.show{opacity:1}
  .db .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6d7878}
  .db .arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:20px}
  .db .prev{left:12px}.db .next{right:12px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs img{width:84px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .thumbs img.on{border-color:var(--brand)}
  .info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);align-self:start}
  .info h1{margin:0 0 4px;font-size:24px}
  .info .p{font-size:30px;font-weight:800;color:var(--brand);margin:8px 0 16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
  .grid .k{color:var(--muted);font-size:13px}
  .grid .v{font-weight:700}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .flist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .flist span{background:#f1f3f3;color:#4a5555;padding:5px 11px;border-radius:8px;font-size:13px}
  .cta{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;padding:14px;border-radius:11px;font-weight:800;margin-top:18px}
  .cta:hover{background:var(--brand-dark)}
  .cta-wa{background:var(--wa)}
  .cta-wa:hover{background:var(--wa-dark)}
  .back{display:inline-block;margin:16px 0 0 20px;color:var(--muted);font-weight:600}
  .desc{color:#3c4646;line-height:1.6}
  .desc p{margin:0 0 9px}
  .desc ul.dlist{margin:0 0 10px;padding-left:0;list-style:none}
  .desc ul.dlist li{position:relative;padding:3px 0 3px 18px}
  .desc ul.dlist li:before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .desc b{color:var(--ink)}
  @media(max-width:820px){.detail{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="/"><img src="/img/emblem.png" alt="CarConnect24" class="logo-mark"><span class="logo-txt notranslate" translate="no">Car<i>Connect</i><b>24</b></span></a>
  <nav class="nav"><a class="nl" href="/" data-i18n="nav.home">Home</a><a href="/stock" data-i18n="nav.stock">Our stock</a><a class="nl" href="/#faq" data-i18n="nav.faq">FAQ</a><a class="wa" data-i18n-wa="wa.question"><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.7.9 3.6.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.4M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2m0 18.2c-1.6 0-3.2-.5-4.6-1.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2"/></svg><span data-i18n="nav.whatsapp">WhatsApp</span></a><span class="langsel"></span><a href="/admin.html" class="adminlink" data-i18n="nav.admin">Admin</a></nav>
</div></header>
<a class="back" href="/stock" data-i18n="nav.back">← Back to stock</a>
<div class="detail" id="detail">Loading…</div>
<footer class="foot"><div class="foot-in" style="grid-template-columns:1fr"><div><img src="/img/logo-full-light.png" alt="CarConnect24" class="flogo"><p class="blurb" data-i18n="foot.blurb"></p><div class="vat" data-vat></div></div></div><div class="foot-bot"><div>&copy; <span id="yr"></span> CarConnect24 &middot; carconnect24.eu</div><div><a href="/" data-i18n="nav.home">Home</a> &middot; <a href="/stock" data-i18n="nav.stock">Our stock</a> &middot; <a href="/#faq" data-i18n="nav.faq">FAQ</a></div></div></footer><a class="wafloat" data-i18n-wa="wa.hello" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.7.9 3.6.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.4M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2m0 18.2c-1.6 0-3.2-.5-4.6-1.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2"/></svg></a>

<script src="/i18n.js?v=77a9dd34"></script>
<script src="/site.js?v=a918a8c9"></script>
<script>
const T=k=>(window.t?window.t(k):k);
/* Turn the *bold* / "* bullet" style dealers paste in into real formatting.
   escapeHtml() runs FIRST, so nothing stored can inject markup. */
function richText(raw){
  var safe = escapeHtml(raw);
  var lines = safe.split(/\r?\n/);
  var out = [], list = [];
  function flush(){ if(list.length){ out.push('<ul class="dlist">'+list.join('')+'</ul>'); list=[]; } }
  lines.forEach(function(ln){
    var t = ln.trim();
    var m = t.match(/^[*\u2022-]\s+(.*)$/);      // "* item", "- item", "• item"
    if(m){ list.push('<li>'+bold(m[1])+'</li>'); return; }
    flush();
    if(t) out.push('<p>'+bold(t)+'</p>');
  });
  flush();
  return out.join('');
}
function bold(x){ return x.replace(/\*([^*]+)\*/g, '<b>$1</b>'); }
const tv=v=>v?(window.t?window.t('v.'+v):v):'—';
const euro=n=>n==null?'—':'€'+(+n).toLocaleString('de-DE');
const km=n=>n==null?'—':(+n).toLocaleString('de-DE')+' km';
const id=new URLSearchParams(location.search).get('id');
document.getElementById('detail').textContent = T('cd.loading');
let CAR = null;
fetch('/api/cars/'+id).then(r=>{if(!r.ok)throw 0;return r.json();}).then(c=>{CAR=c;render(c);})
  .catch(()=>{document.getElementById('detail').innerHTML='<p>'+T('cd.notfound')+' <a href="/stock">'+T('nav.back')+'</a></p>';});

/* redraw the car in the newly chosen language */
document.addEventListener('langchange', ()=>{ if(CAR) render(CAR); });

function render(c){
  document.title = `${c.make} ${c.model} — CarConnect24`;
  const photos=c.photos.length?c.photos:[];
  const gallery = photos.length
    ? photos.map((p,i)=>`<img src="${p}" class="${i===0?'show':''}">`).join('') +
      (photos.length>1?'<button class="arrow prev">‹</button><button class="arrow next">›</button>':'')
    : '<div class="ph">No photos</div>';
  const thumbs = photos.length>1 ? `<div class="thumbs">${photos.map((p,i)=>`<img src="${p}" class="${i===0?'on':''}" data-i="${i}">`).join('')}</div>`:'';
  const spec=(k,v)=>`<div class="k">${k}</div><div class="v">${v}</div>`;
  const feats=(c.features||[]).map(f=>`<span>${f}</span>`).join('') || '<span>—</span>';
  document.getElementById('detail').innerHTML=`
    <div>
      <div class="db">${gallery}</div>
      ${thumbs}
      ${c.description?`<div class="info" style="margin-top:16px"><h3 style="margin:0 0 8px">${T('cd.desc')}</h3><div class="desc">${richText(c.description)}</div></div>`:''}
    </div>
    <div class="info">
      <h1>${c.make} ${c.model}</h1>
      <div style="color:var(--muted)">${c.year||''} · ${km(c.mileage)}${c.sold?' · <b style="color:#c0392b">'+T('sp.sold')+'</b>':''}</div>
      <div class="p">${euro(c.price)}</div>
      <div class="grid">
        ${spec(T('cd.year'),c.year||'—')}${spec(T('cd.mileage'),km(c.mileage))}
        ${spec(T('cd.fuel'),tv(c.fuel))}${spec(T('cd.gearbox'),tv(c.gearbox))}
        ${spec(T('cd.power'),c.power?c.power+' hp':'—')}${spec(T('cd.body'),tv(c.body))}
        ${spec(T('cd.color'),c.color||'—')}${spec(T('cd.doors'),c.doors||'—')}
        ${spec(T('cd.seats'),c.seats||'—')}${spec(T('cd.location'),c.location||'Belgium')}
      </div>
      <h3 style="margin:0 0 4px">${T('cd.features')}</h3>
      <div class="flist">${feats}</div>
      <a class="cta cta-wa" id="waCta" href="#no-whatsapp"><span style="display:inline-flex;align-items:center;gap:9px;justify-content:center"><svg style="width:19px;height:19px;fill:#fff" viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.7.9 3.6.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.4M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2m0 18.2c-1.6 0-3.2-.5-4.6-1.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2"/></svg><span data-i18n="cd.contact">Contact us about this car</span></span></a>
    </div>`;
  wire(photos.length);

  /* WhatsApp CTA — prefill the message with this exact car so the dealer
     immediately knows which one the buyer means. */
  var cta = document.getElementById('waCta');
  if (cta) {
    var priceTxt = c.price == null ? '' : ' (' + euro(c.price) + ')';
    var msg = T('wa.car') + ' '
            + [c.make, c.model, c.year].filter(Boolean).join(' ') + priceTxt
            + '\n' + location.href;
    cta.setAttribute('href', window.waHref ? window.waHref(msg) : '#no-whatsapp');
  }
  var yr = document.getElementById('yr');
  if (yr) yr.textContent = new Date().getFullYear();
  if (window.applyI18n) window.applyI18n();   // the detail is built AFTER first paint
}
function wire(n){
  if(n<2)return;
  const imgs=[...document.querySelectorAll('.db img')];
  const thumbs=[...document.querySelectorAll('.thumbs img')];
  let idx=0;
  const show=i=>{imgs[idx].classList.remove('show');thumbs[idx]&&thumbs[idx].classList.remove('on');
    idx=(i+n)%n;imgs[idx].classList.add('show');thumbs[idx]&&thumbs[idx].classList.add('on');};
  document.querySelector('.next').onclick=()=>show(idx+1);
  document.querySelector('.prev').onclick=()=>show(idx-1);
  thumbs.forEach(t=>t.onclick=()=>show(+t.dataset.i));
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
</body>
</html>
